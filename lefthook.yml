pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,js}"
      run: npx eslint --max-warnings 0 {staged_files}
    format:
      glob: "*.{ts,js,json,md,yml,yaml}"
      run: npx prettier --check {staged_files}
    typecheck:
      glob: "*.ts"
      run: npx tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
