name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run knip
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code --stat drizzle || (echo "Run npm run db:generate and commit the migration." && exit 1)
          test -z "$(git ls-files --others --exclude-standard drizzle)" || (echo "Run npm run db:generate and commit the migration." && exit 1)
